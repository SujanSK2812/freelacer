{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Set New Password - Freelancer Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .password-field-wrapper {
            position: relative !important;
            width: 100% !important;
            display: block !important;
            margin-bottom: 16px !important;
        }

        .password-field-wrapper input {
            width: 100% !important;
            padding: 1rem 3rem 1rem 1.25rem !important;
            box-sizing: border-box !important;
        }

        .password-toggle-icon {
            position: absolute !important;
            right: 16px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            color: #9aa6b5 !important;
            cursor: pointer !important;
            font-size: 16px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 28px !important;
            height: 28px !important;
            border-radius: 50% !important;
            transition: color 0.2s ease, background 0.2s ease !important;
            user-select: none !important;
            z-index: 10 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .password-toggle-icon:hover {
            color: #108a00 !important;
            background: #f0f7f0 !important;
        }
    </style>
</head>
<body>

{% include 'includes/header.html' %}

<main>
    <div class="login-container">
        <h2>Set New Password</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="error" style="margin-bottom: 15px; font-size: 14px; color: #dc3545; text-align: center;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="password-field-wrapper">
                <input type="password" name="password" id="newPasswordInput" placeholder="New Password" required>
                <span class="password-toggle-icon" onclick="togglePasswordVisibility('newPasswordInput', this)" title="Toggle password visibility">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <div class="password-field-wrapper">
                <input type="password" name="confirm_password" id="confirmPasswordInput" placeholder="Confirm New Password" required>
                <span class="password-toggle-icon" onclick="togglePasswordVisibility('confirmPasswordInput', this)" title="Toggle password visibility">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <button type="submit" style="margin-top: 10px;">Update Password</button>
        </form>

        <div class="signup-link" style="margin-top: 20px;">
            <p>Back to <a href="{% url 'accounts:login' %}">Log In</a></p>
        </div>
    </div>
</main>

{% include 'includes/footer.html' %}

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>

</body>
</html>
