{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Freelancer Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .password-field-wrapper {
            position: relative !important;
            width: 100% !important;
            display: block !important;
            margin: 0 !important;
        }

        .password-field-wrapper input {
            width: 100% !important;
            padding: 1rem 3rem 1rem 1.25rem !important;
            box-sizing: border-box !important;
        }

        .password-toggle-icon {
            position: absolute !important;
            right: 16px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            color: #9aa6b5 !important;
            cursor: pointer !important;
            font-size: 16px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 28px !important;
            height: 28px !important;
            border-radius: 50% !important;
            transition: color 0.2s ease, background 0.2s ease !important;
            user-select: none !important;
            z-index: 10 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .password-toggle-icon:hover {
            color: #0a66c2 !important;
            background: #f0f7f0 !important;
        }
    </style>
</head>
<body>

{% include 'includes/header.html' %}

<main>
    <div class="login-container">
        <h2>Login</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="{% if message.tags %}{{ message.tags }}{% else %}error{% endif %}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter Email" required>
            <div class="password-field-wrapper">
                <input type="password" name="password" id="passwordInput" placeholder="Enter Password" required>
                <span class="password-toggle-icon" onclick="togglePasswordVisibility('passwordInput', this)" title="Toggle password visibility">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <button type="submit">Login</button>
        </form>

        <div class="forgot-password">
            <a href="{% url 'accounts:password-reset' %}">Forgot Password?</a>
        </div>

        <div class="signup-link">
            <p>Don't have an account? <a href="{% url 'accounts:select_role' %}">Sign Up</a></p>
        </div>
    </div>
</main>

{% include 'includes/footer.html' %}

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>

</body>
</html>
