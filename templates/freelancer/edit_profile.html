{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Edit Profile | FreelanceHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f2ef;
      color: #191919;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .dashboard-container {
      flex: 1;
      max-width: 600px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .main-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid #e0e0e0;
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card-header {
      padding: 2rem 2.25rem;
      border-bottom: 1px solid #eef3f8;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .card-header-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #eef3f8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #d0e1f9;
    }

    .card-header-icon i {
      color: #0a66c2;
      font-size: 1.4rem;
    }

    .card-header h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.015em;
    }

    .card-header p {
      color: #5e5e5e;
      font-size: 0.88rem;
      margin-top: 0.25rem;
      font-weight: 400;
    }

    .job-form {
      padding: 2.25rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: flex;
      align-items: center;
      color: #191919;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }

    .form-group label i {
      color: #0a66c2;
      font-size: 1.1rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border: 1px solid #00000099;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      color: #191919;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0a66c2;
      box-shadow: 0 0 0 1px #0a66c2;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eef3f8;
    }

    .btn-cancel {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #5e5e5e;
      background: transparent;
      border: 1px solid #5e5e5e;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .btn-cancel:hover {
      background: #f3f2ef;
      color: #191919;
    }

    .post-job-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #0a66c2;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .post-job-btn:hover {
      background: #004182;
    }
  </style>
</head>
<body>

{% include 'includes/header.html' %}

<div class="dashboard-container">
  <div class="main-card">
    <div class="card-header">
      <div class="card-header-icon">
        <i class="fas fa-user-edit"></i>
      </div>
      <div>
        <h2>Edit Account</h2>
        <p>Update your basic account information.</p>
      </div>
    </div>
    
    <div class="job-form">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="username"><i class="fas fa-at"></i>Username</label>
          <input type="text" id="username" name="username" value="{{ user.username }}" required>
        </div>

        <div class="form-actions">
          <a href="{% url 'freelancer:freelancer_dashboard' %}" class="btn-cancel">Cancel</a>
          <button type="submit" class="post-job-btn">
            <i class="fas fa-save"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% include 'includes/footer.html' %}

</body>
</html>
